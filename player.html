<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}iframe{border:0;width:100%;height:100%;display:block}</style>
</head>
<body>
<script>
  var v = new URLSearchParams(location.search).get('v') || '';
  var f = document.createElement('iframe');
  f.src = 'https://www.youtube.com/embed/' + encodeURIComponent(v) + '?playsinline=1&autoplay=1&rel=0&fs=1';
  f.allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen; accelerometer; gyroscope';
  f.setAttribute('allowfullscreen', '');
  document.body.appendChild(f);
</script>
</body>
</html>
